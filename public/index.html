<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T&amp;OT Foundation · Command Center</title>
<meta name="description" content="Management UI for the T&amp;OT Foundation — Digital Strategy Business Unit, NTT DATA USA. Strategy scoreboard, commercial pipeline, people &amp; capacity, assets &amp; certification engine.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/styles.css">
<script>
  // Runs before first paint so the chosen theme never flashes the wrong one.
  // Saved choice wins; otherwise follow the operating system.
  (function () {
    try {
      var saved = localStorage.getItem('tot_cc_theme');
      var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>
</head>
<body>

<!-- ── Passcode gate ─────────────────────────────────────────────────────── -->
<div id="gate">
  <div class="gate-card">
    <div class="eyebrow">Digital Strategy Business Unit</div>
    <h1>T&amp;OT <span>Command Center</span></h1>
    <p>Strategy cycle 2026–2028</p>
    <form id="gate-form">
      <label class="field">
        <span class="sr-only">Passcode</span>
        <input type="password" id="gate-input" placeholder="Passcode" autocomplete="current-password" required>
      </label>
      <button type="submit" class="btn primary" id="gate-submit">Enter</button>
    </form>
    <div class="gate-error" id="gate-error" role="alert"></div>
  </div>
</div>

<!-- ── Application ───────────────────────────────────────────────────────── -->
<div class="app" id="app" hidden>

  <div class="nav-scrim" id="nav-scrim"></div>

  <!-- ── Sidebar ── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-name">T&amp;OT Foundation</div>
      <div class="brand-sub">Command Center</div>
      <div class="brand-tags">
        <span class="brand-tag">NTT DATA</span>
        <span class="brand-tag">Digital Strategy</span>
      </div>
    </div>

    <nav class="nav-sections" id="nav-sections" aria-label="Sections"></nav>

    <div class="sidebar-foot">
      <div class="nav-footer" id="nav-footer">Loading…</div>
    </div>
  </aside>

  <!-- ── Main ── -->
  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 4h13M1.5 8h13M1.5 12h13"/></svg>
        </button>
        <span class="crumb" id="crumb">Strategy</span>
      </div>
      <div class="topbar-actions">
        <button class="btn sm" id="btn-theme" title="Switch between light and dark" aria-pressed="false">
          <span class="theme-icon" aria-hidden="true">☾</span><span id="theme-label">Dark</span>
        </button>
        <button class="btn sm" id="btn-refresh" title="Reload all data from the database">Refresh</button>
        <button class="btn sm" id="btn-print" title="Print or save the current view as PDF">Print</button>
        <button class="btn sm danger" id="btn-logout">Sign out</button>
      </div>
    </header>

    <div class="page">
      <div class="page-head">
        <h1 id="page-title">Strategy</h1>
        <p id="page-sub">Playing to Win — one goal, three drivers, four pillars</p>
      </div>

      <div id="loading" class="loading">LOADING WORKSPACE…</div>

      <main id="views" hidden>
        <section class="view" id="view-strategy"   role="region" aria-label="Strategy"></section>
        <section class="view" id="view-pipeline"   role="region" aria-label="Pipeline" hidden></section>
        <section class="view" id="view-people"     role="region" aria-label="People" hidden></section>
        <section class="view" id="view-assets"     role="region" aria-label="Assets and certifications" hidden></section>
        <section class="view" id="view-financials" role="region" aria-label="Financials" hidden></section>
      </main>
    </div>
  </div>

</div>

<!-- ── Record editor ─────────────────────────────────────────────────────── -->
<div class="modal-backdrop" id="modal-backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h2 id="modal-title">Edit</h2>
    <form id="modal-form">
      <div class="fields" id="modal-fields"></div>
      <footer>
        <button type="button" class="btn" id="modal-cancel">Cancel</button>
        <button type="submit" class="btn primary" id="modal-save">Save</button>
      </footer>
    </form>
  </div>
</div>

<div id="toast" hidden role="status"></div>

<script type="module" src="/app.js"></script>
</body>
</html>
